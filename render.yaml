services:
  - type: web
    name: aislopcraft-online
    runtime: node
    plan: free
    numInstances: 1 # Rooms and claimed names are process-local; keep one instance.
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
