name: Native C++ builds and headless tests

on:
  push:
    branches: [arena/433092f5-aislopcraft]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} Release / CTest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - name: Checkout (pinned actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux SDL/OpenGL build headers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libdbus-1-dev libpulse-dev \
            libudev-dev libwayland-dev wayland-protocols libx11-dev libxext-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgl1-mesa-dri xvfb xauth mesa-utils

      - name: Configure desktop app and tests (pinned SDL3 source/SHA256)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
              -DVOXCRAFT_BUILD_APP=ON -DVOXCRAFT_BUILD_TESTS=ON \
              -DVOXCRAFT_FETCH_SDL3=ON
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DVOXCRAFT_BUILD_APP=ON -DVOXCRAFT_BUILD_TESTS=ON \
              -DVOXCRAFT_FETCH_SDL3=ON
          fi

      - name: Compile complete native application
        shell: bash
        run: cmake --build build --config Release --parallel 2 2>&1 | tee build-log.txt

      - name: Surface build errors as check annotations (logs host is inaccessible in sandbox)
        if: failure()
        shell: bash
        run: |
          if [[ -f build-log.txt ]]; then
            { grep -Ei 'fatal error|error [A-Z]+[0-9]+:|error:|FAILED:|LNK[0-9]+|MSB[0-9]+' build-log.txt || true; } | tail -n 20 |
              while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Assert CTest discovered the full suite
        shell: bash
        run: |
          # Capture the exit code as well as the output: CTest itself may fail
          # before any of the grep assertions can run.
          if ! ctest --test-dir build -C Release -N 2>&1 | tee test-discovery.txt; then
            echo '::error::CTest discovery command failed before test-count assertion'
            while IFS= read -r line; do echo "::error::$line"; done < test-discovery.txt
            exit 1
          fi
          if ! grep -Eq '^Total Tests:[[:space:]]*3[[:space:]]*$' test-discovery.txt; then
            echo '::error::CTest did not discover exactly three tests'
            while IFS= read -r line; do echo "::error::$line"; done < test-discovery.txt
            exit 1
          fi
          for name in voxcore_tests vox_asset_audit vox_startup_smoke; do
            if ! grep -Eq "Test[[:space:]]*#[[:space:]]*[0-9]+:[[:space:]]*$name" test-discovery.txt; then
              echo "::error::CTest did not discover $name"
              while IFS= read -r line; do echo "::error::$line"; done < test-discovery.txt
              exit 1
            fi
          done

      - name: Run core, asset and headless app smoke tests
        shell: bash
        run: |
          if ! ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test-results.txt; then
            echo '::error::CTest failed; consult the test output below'
            { grep -Ei 'failed|error|exception|check failed' test-results.txt || true; } | tail -n 20 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Validate the one-command Windows build helper (incremental rebuild)
        if: runner.os == 'Windows'
        shell: cmd
        run: call build-windows.cmd

      - name: Render title, world and creative UI on Mesa software OpenGL (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
            env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 \
            ./build/aislopcraft --visual-smoke visual-smoke 2>&1 | tee visual-smoke.log; then
            echo '::error::Software OpenGL smoke failed; recent output follows'
            tail -n 20 visual-smoke.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, struct
          for name in ('title.png', 'world.png', 'creative.png'):
              try:
                  image = pathlib.Path('visual-smoke') / name
                  data = image.read_bytes()
                  assert len(data) > 5000, f'{image}: suspiciously small'
                  assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{image}: invalid PNG header'
                  assert struct.unpack('>II', data[16:24]) == (1280, 720), f'{image}: wrong size'
                  print(f'{image}: PNG 1280x720, {len(data)} bytes')
              except Exception as exc:
                  print(f'::error::{exc}')
                  raise
          PY

      - name: Package runnable native game and original assets
        shell: bash
        run: |
          mkdir -p package
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp build/Release/aislopcraft.exe package/
            cp -r build/Release/assets package/
          else
            cp build/aislopcraft package/
            cp -r build/assets package/
            cp -r visual-smoke package/
          fi
          cp README.md LICENSE package/
          cp -r docs package/
          test -s package/aislopcraft.exe || test -s package/aislopcraft
          test -s package/assets/atlas.png

      - name: Upload Linux software-GL captures for visual inspection
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aislopcraft-Linux-software-gl-captures
          path: visual-smoke/
          if-no-files-found: error

      - name: Upload runnable bundle (not a graphical test)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aislopcraft-${{ runner.os }}-x64
          path: package/
          if-no-files-found: error

      - name: Upload CTest discovery and result logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-logs-${{ runner.os }}
          path: |
            build-log.txt
            test-discovery.txt
            test-results.txt
            visual-smoke.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  windows_vs2026:
    name: windows-2025-vs2026 / CMD build helper / CTest
    runs-on: windows-2025-vs2026
    timeout-minutes: 55
    steps:
      - name: Checkout (pinned actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and test with detected Visual Studio 2026 MSVC
        shell: cmd
        run: call build-windows.cmd

      - name: Assert three named tests were discovered
        shell: pwsh
        run: |
          $output = ctest --test-dir build/Release -C Release -N
          $output | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0 -or (($output | Out-String) -notmatch '(?m)^Total Tests:\s*3\s*$')) {
            throw 'Expected three CTests on Visual Studio 2026'
          }
